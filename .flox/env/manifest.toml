schema-version = "1.12.0"

[install]
act.pkg-path = "act"
act.pkg-group = "act"
age.pkg-path = "age"
age.pkg-group = "age"
betterleaks.pkg-path = "betterleaks"
betterleaks.pkg-group = "betterleaks"
biome.pkg-path = "biome"
biome.pkg-group = "biome"
bun.pkg-path = "bun"
bun.pkg-group = "bun"
canopy.flake = "github:RogerNavelsaker/nixpkg-canopy"
canopy.outputs = ["out", "cn"]
cloudflare-cli.flake = "github:RogerNavelsaker/nixpkg-cloudflare-cli"
curl.pkg-path = "curl"
curl.pkg-group = "curl"
nixfmt.pkg-path = "nixfmt-rfc-style"
nixfmt.pkg-group = "nixfmt"
fd.pkg-path = "fd"
fd.pkg-group = "fd"
findutils.pkg-path = "findutils"
ripgrep.pkg-path = "ripgrep"
ripgrep.pkg-group = "ripgrep"
procps.pkg-path = "procps"
procps.pkg-group = "procps"
gnugrep.pkg-path = "gnugrep"
gnugrep.pkg-group = "gnugrep"
gcc.pkg-path = "gcc"
gcc.pkg-group = "gcc"
glibc.pkg-path = "glibc"
gh.pkg-path = "gh"
gh.pkg-group = "gh"
git.pkg-path = "git"
git.pkg-group = "git"
jq.pkg-path = "jq"
jq.pkg-group = "jq"
knip.flake = "github:RogerNavelsaker/nixpkg-knip"
mulch.flake = "github:RogerNavelsaker/nixpkg-mulch"
mulch.outputs = ["out", "ml"]
perl.pkg-path = "perl"
perl.pkg-group = "perl"
seeds.flake = "github:RogerNavelsaker/nixpkg-seeds"
seeds.outputs = ["out", "sd"]
sops.pkg-path = "sops"
sops.pkg-group = "sops"
terrarium.flake = "github:RogerNavelsaker/nixpkg-terrarium"
terrarium.outputs = ["out", "tr"]
tinacms-cli.flake = "github:RogerNavelsaker/nixpkg-tinacms-cli"
trellis.flake = "github:RogerNavelsaker/nixpkg-trellis"
trellis.outputs = ["out", "tl"]
typescript-language-server.pkg-path = "typescript-language-server"
typescript-language-server.pkg-group = "typescript-language-server"
worktrunk.pkg-path = "worktrunk"
worktrunk.pkg-group = "worktrunk"
wrangler.pkg-path = "wrangler"
wrangler.pkg-group = "wrangler"
yq.pkg-path = "yq"
yq.pkg-group = "yq"
zellij.pkg-path = "zellij"
zellij.pkg-group = "zellij"
cacert.pkg-path = "cacert"
nodejs_24.pkg-path = "nodejs_24"

[vars]
NODE_ENV = "development"

[hook]
on-activate = '''
  export PATH="$FLOX_ENV_PROJECT/scripts:$PATH"
  GCC_RUNTIME_LIB="$(dirname "$(gcc -print-file-name=libstdc++.so.6)")"
  export LD_LIBRARY_PATH="$GCC_RUNTIME_LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
  FLOX_CERT_FILE="$FLOX_ENV_PROJECT/.flox/run/x86_64-linux.senshac.run/etc/ssl/certs/ca-bundle.crt"
  if [ ! -f "$FLOX_CERT_FILE" ]; then
    FLOX_CERT_FILE="$FLOX_ENV_PROJECT/.flox/run/x86_64-linux.senshac.dev/etc/ssl/certs/ca-bundle.crt"
  fi
  if [ -f "$FLOX_CERT_FILE" ]; then
    export SSL_CERT_FILE="$FLOX_CERT_FILE"
    export NIX_SSL_CERT_FILE="$FLOX_CERT_FILE"
    export NODE_EXTRA_CA_CERTS="$FLOX_CERT_FILE"
  fi

  if [ -f package.json ] && [ ! -d node_modules ]; then
    echo "Installing dependencies..."
    bun install
  fi

  if [ -z "${QUIET:-}" ]; then
    cat <<'EOF'
Senshac Development Environment

Astro + Alpine.js + HTMX + UnoCSS

Quick Commands:
  dx <command>                          Run through direnv exec .
  fx <command>                          Run through flox activate -d .
  dev [start|stop|restart|status|log]   Astro dev server
  cms [start|stop|restart|status|log]   TinaCMS + Astro
  bun run build                         Build for production
  bun run preview                       Preview production build
  bun run check                         Run Astro check
  bun run deploy                        Deploy to Cloudflare Pages
  sd, ml, cn, tr, tl                    Seeds, Mulch, Canopy, Terrarium, Trellis
EOF
  fi
'''

[options]
systems = ["x86_64-linux"]
