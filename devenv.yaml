# Inputs are pinned in devenv.lock by `devenv update`.
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  # devenv v1.8.1's generated flake exposes this compatibility alias. Declare
  # the same follows edge so the committed project graph matches evaluation.
  pre-commit-hooks:
    follows: git-hooks
