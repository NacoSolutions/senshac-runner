name: Trellis readiness

on:
  pull_request:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Fetch pinned Trellis CLI
        run: |
          git clone --quiet https://github.com/jayminwest/trellis.git "$RUNNER_TEMP/trellis"
          git -C "$RUNNER_TEMP/trellis" checkout --quiet fd3bbadf1fa92c3b15e72836689b30094f4f534a
          bun install --cwd "$RUNNER_TEMP/trellis" --frozen-lockfile
      - name: Audit agent readiness
        run: bun "$RUNNER_TEMP/trellis/src/cli/main.ts" audit . --no-persist --no-output --fail-on none
      - name: Check canonical drift
        run: bun "$RUNNER_TEMP/trellis/src/cli/main.ts" drift . --fail-on none
