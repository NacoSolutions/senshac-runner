name: CI

on:
  pull_request:
    paths:
      - '.flox/env/**'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Containerfile.warren-agent'
      - 'flake.nix'
      - 'AGENTS.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runner contract
        run: |
          for script in scripts/*; do bash -n "$script"; done
          test -s AGENTS.md
          test -s docs/ci-runner-image.md
          test -s docs/warren-agent-runtime.md
          test -x scripts/build-ci-runner
          test -x scripts/verify-ci-runner
          test -x scripts/verify-ci-runner-local
          test -x scripts/act-ci
          test -x scripts/build-warren-agent
          test -s Containerfile.warren-agent
      - name: Validate Flox manifest and regression contracts
        run: |
          scripts/check-flox-lock
          python3 -m unittest discover -s tests -v
