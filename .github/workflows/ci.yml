name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runner contract
        run: |
          for script in scripts/*; do bash -n "$script"; done
          test -s AGENTS.md
          test -s docs/ci-runner-image.md
          test -s docs/warren-agent-runtime.md
          test -x scripts/build-ci-runner
          test -x scripts/verify-ci-runner
          test -x scripts/verify-ci-runner-local
          test -x scripts/act-ci
          test -x scripts/build-warren-agent
          test -s Containerfile.warren-agent
      - name: Validate Flox manifest
        run: |
          scripts/check-flox-lock
          python3 -m unittest discover -s tests -v
      - name: Build and smoke-test Warren agent image
        run: |
          CONTAINER_RUNTIME=docker scripts/build-warren-agent senshac-warren-agent:ci
          docker run --rm --entrypoint sh senshac-warren-agent:ci -lc '
            command -v pi
            command -v gh
            command -v git
            command -v jq
            command -v tar
            test "$(command -v tr)" = /usr/local/bin/tr
            test "$(command -v terrarium)" = /usr/local/bin/terrarium
            tr --help
            terrarium --help
            sd --version
            ml --version
            trellis --help
          '
