name: Verify CI Runner Container

on:
  pull_request:
    paths:
      - '.flox/env/**'
      - 'scripts/build-ci-runner'
      - 'scripts/check-flox-lock'
      - 'scripts/smoke-ci-runner'
      - 'scripts/verify-ci-runner*'
      - 'scripts/report-ci-image-size'
      - 'scripts/verify-nix-base'
      - 'tests/test_runner_contract.py'
      - 'tests/test_flake_contract.py'
      - 'flake.nix'
      - 'docs/modular-oci-environment.md'
      - 'scripts/check-oci-flake'
      - '.github/workflows/verify-ci-runner.yml'
      - '.github/workflows/publish-ci-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: flox/install-flox-action@v2.5.3
        with:
          version: '1.16.0'
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Validate lock and regression tests
        run: |
          scripts/check-flox-lock
          python3 -m unittest discover -s tests -v
          scripts/check-oci-flake
          nix --extra-experimental-features 'nix-command flakes' build --no-write-lock-file --out-link "$RUNNER_TEMP/oci-image" .#ociImage
      - name: Build and verify local Docker image
        env:
          CONTAINER_RUNTIME: docker
        run: |
          scripts/build-ci-runner senshac-runner:pr-check
          scripts/smoke-ci-runner senshac-runner:pr-check
      - name: Load and smoke-test Nix OCI canary
        env:
          CONTAINER_RUNTIME: docker
        run: |
          docker load --input "$RUNNER_TEMP/oci-image"
          docker image inspect senshac-runner-oci:modular >/dev/null
          scripts/verify-nix-base senshac-runner-oci:modular
      - name: Report image measurements
        env:
          CONTAINER_RUNTIME: docker
        run: scripts/report-ci-image-size "$RUNNER_TEMP/oci-image" senshac-runner:pr-check
