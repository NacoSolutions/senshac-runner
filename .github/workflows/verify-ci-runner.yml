name: Verify CI Runner Container

on:
  pull_request:
    paths:
      - '.flox/env/**'
      - '.flox/ci/**'
      - 'scripts/build-ci-runner'
      - 'scripts/build-minimal-flox'
      - 'scripts/check-flox-lock'
      - 'scripts/smoke-ci-runner'
      - 'scripts/verify-ci-runner*'
      - 'scripts/verify-minimal-flox'
      - 'scripts/report-ci-image-size'
      - 'scripts/verify-nix-base'
      - 'tests/test_runner_contract.py'
      - 'tests/test_flake_contract.py'
      - 'flake.nix'
      - 'docs/modular-oci-environment.md'
      - 'scripts/check-oci-flake'
      - '.github/workflows/verify-ci-runner.yml'
      - '.github/workflows/publish-ci-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # This is the only image-building job. Its archives are the immutable
  # producer/consumer boundary for every later check in this workflow.
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: flox/install-flox-action@v2.5.3
        with:
          version: '1.16.0'
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Validate lock, flake, and regression tests
        run: |
          scripts/check-flox-lock
          python3 -m unittest discover -s tests -v
          scripts/check-oci-flake
      - name: Build full Flox image once
        env:
          CONTAINER_RUNTIME: docker
        run: |
          scripts/build-ci-runner senshac-runner:pr-check
          docker save senshac-runner:pr-check -o "$RUNNER_TEMP/full-flox-image.tar"
      - name: Build minimal Flox image once
        env:
          CONTAINER_RUNTIME: docker
        run: |
          scripts/build-minimal-flox senshac-runner:minimal-flox-pr
          docker save senshac-runner:minimal-flox-pr -o "$RUNNER_TEMP/minimal-flox-image.tar"
      - name: Build Nix OCI archive once
        run: |
          nix --extra-experimental-features 'nix-command flakes' build \
            --no-write-lock-file --out-link "$RUNNER_TEMP/oci-image" .#ociImage
          cp "$RUNNER_TEMP/oci-image" "$RUNNER_TEMP/oci-image.tar.gz"
      - name: Upload immutable image archives
        uses: actions/upload-artifact@v4.6.2
        with:
          name: senshac-runner-images-${{ github.sha }}
          path: |
            ${{ runner.temp }}/full-flox-image.tar
            ${{ runner.temp }}/minimal-flox-image.tar
            ${{ runner.temp }}/oci-image.tar.gz
          if-no-files-found: error
          retention-days: 7

  verify-image:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4.3.0
        with:
          name: senshac-runner-images-${{ github.sha }}
          path: ${{ runner.temp }}/runner-images
      - name: Load the producer's exact image archives
        run: |
          docker load --input "$RUNNER_TEMP/runner-images/full-flox-image.tar"
          docker load --input "$RUNNER_TEMP/runner-images/minimal-flox-image.tar"
          docker load --input "$RUNNER_TEMP/runner-images/oci-image.tar.gz"
      - name: Verify full Flox producer output
        env:
          CONTAINER_RUNTIME: docker
        run: scripts/smoke-ci-runner senshac-runner:pr-check
      - name: Verify minimal Flox producer output
        env:
          CONTAINER_RUNTIME: docker
        run: scripts/verify-minimal-flox senshac-runner:minimal-flox-pr
      - name: Verify Nix producer output
        env:
          CONTAINER_RUNTIME: docker
        run: |
          docker image inspect senshac-runner-oci:modular >/dev/null || {
            echo 'Nix producer image was not loaded as senshac-runner-oci:modular' >&2
            exit 1
          }
          scripts/verify-nix-base senshac-runner-oci:modular
      - name: Report image measurements
        env:
          CONTAINER_RUNTIME: docker
        run: |
          scripts/report-ci-image-size \
            "$RUNNER_TEMP/runner-images/oci-image.tar.gz" \
            senshac-runner:pr-check senshac-runner:minimal-flox-pr
