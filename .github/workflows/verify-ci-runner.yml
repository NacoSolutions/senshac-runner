name: Verify CI Runner Container

on:
  pull_request:
    paths:
      - '.flox/env/**'
      - 'scripts/build-ci-runner'
      - 'scripts/check-flox-lock'
      - 'scripts/smoke-ci-runner'
      - 'scripts/verify-ci-runner*'
      - 'scripts/report-ci-image-size'
      - 'scripts/verify-nix-base'
      - 'tests/test_runner_contract.py'
      - 'tests/test_flake_contract.py'
      - 'flake.nix'
      - 'docs/modular-oci-environment.md'
      - 'scripts/check-oci-flake'
      - '.github/workflows/verify-ci-runner.yml'
      - '.github/workflows/publish-ci-runner.yml'
  workflow_dispatch:

concurrency:
  group: verify-runner-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # This is the only image-building job. Its archives are the immutable
  # producer/consumer boundary for every later check in this workflow.
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The PR CI workflow owns source and regression validation. This workflow
      # builds the single producer output only after that validation pass.
      - name: Validate the Flox source lock
        run: scripts/check-flox-lock
      - name: Build the Nix dockerTools image once
        env:
          OCI_ARCHIVE_OUTPUT: ${{ runner.temp }}/oci-image.tar.gz
        run: scripts/check-oci-flake
      - name: Record immutable image archive metadata
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          sha256sum oci-image.tar.gz > image-archives.sha256
          printf 'workflow_sha=%s\nnix_archive=senshac-runner-oci.tar.gz\n' '${{ github.sha }}' > image-metadata.txt
      - name: Upload immutable image archive and provenance
        uses: actions/upload-artifact@v4.6.2
        with:
          name: senshac-runner-images-${{ github.sha }}
          path: |
            ${{ runner.temp }}/oci-image.tar.gz
            ${{ runner.temp }}/image-archives.sha256
            ${{ runner.temp }}/image-metadata.txt
          if-no-files-found: error
          retention-days: 7

  verify-image:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4.3.0
        with:
          name: senshac-runner-images-${{ github.sha }}
          path: ${{ runner.temp }}/runner-images
      - name: Verify and load the producer's exact image archives
        run: |
          set -eu
          cd "$RUNNER_TEMP/runner-images"
          sha256sum --check image-archives.sha256
          grep -F "workflow_sha=${GITHUB_SHA}" image-metadata.txt
          docker load --input oci-image.tar.gz
      - name: Verify Nix producer output
        env:
          CONTAINER_RUNTIME: docker
        run: |
          docker image inspect senshac-runner-oci:modular >/dev/null || {
            echo 'Nix producer image was not loaded as senshac-runner-oci:modular' >&2
            exit 1
          }
          scripts/verify-nix-base senshac-runner-oci:modular
      - name: Report image measurements
        env:
          CONTAINER_RUNTIME: docker
        run: |
          scripts/report-ci-image-size \
            "$RUNNER_TEMP/runner-images/oci-image.tar.gz" \
            senshac-runner-oci:modular
