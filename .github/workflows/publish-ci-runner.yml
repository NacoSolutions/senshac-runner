name: Publish CI Runner Container

on:
  push:
    branches:
      - main
    paths:
      - ".flox/env/manifest.toml"
      - ".flox/env/manifest.lock"
      - ".github/workflows/publish-ci-runner.yml"
      - "scripts/build-ci-runner"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nacosolutions/senshac-runner

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.immutable.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: flox/install-flox-action@v2.5.3

      - name: Log in to the Container registry
        uses: docker/login-action@v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CI runner image
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Starting Flox build and runtime retagging"
          CONTAINER_RUNTIME=docker scripts/build-ci-runner "${image}:sha-${GITHUB_SHA}"
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Flox build and runtime retagging complete"

      - name: Record current rollback digest
        id: rollback
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          if docker pull "${image}:latest"; then
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${image}:latest")"
          else
            digest="none (first publication)"
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Push immutable image
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          docker push "${image}:sha-${GITHUB_SHA}"

      - name: Verify published immutable image
        id: immutable
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          immutable="${image}:sha-${GITHUB_SHA}"
          echo "::group::[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Smoke-test handoff"
          trap 'echo "::endgroup::"' EXIT
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Re-pulling immutable image ${immutable}"
          docker image rm "${immutable}"
          docker pull "${immutable}"
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Running activated-environment smoke test"
          # Do not override Flox's entrypoint: this verifies commands in the
          # activated environment produced by flox containerize.
          docker run --rm "${immutable}" sh -lc '
            test -n "${FLOX_ENV_PROJECT:-}"
            for tool in tar git gh sd ml tr tl; do
              command -v "$tool"
            done
            tar_path="$(command -v tar)"
            test -x "$tar_path"
            "$tar_path" --version
            git --version
            gh --version
            sd --help >/dev/null
            ml --help >/dev/null
            tr --help >/dev/null
            tl --help >/dev/null
            command -v bun
            command -v flox
            command -v gcc
            command -v unzip
            node <<'NODE'
            require("https").get("https://github.com", response => {
              if (response.statusCode < 200 || response.statusCode >= 400) process.exit(1);
              response.resume();
            }).on("error", () => process.exit(1));
            NODE
            bun <<'BUN'
            const response = await fetch("https://github.com");
            if (!response.ok) process.exit(1);
            BUN
          '
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${immutable}")"
          case "$digest" in
            *@sha256:*) ;;
            *) echo "Published image has no registry digest: $digest" >&2; exit 1 ;;
          esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Smoke test passed; consumer digest is ${digest}"

      - name: Promote verified image to latest
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          immutable="${image}:sha-${GITHUB_SHA}"
          docker tag "${immutable}" "${image}:latest"
          docker push "${image}:latest"
          docker image rm "${image}:latest"
          docker pull "${image}:latest"
          latest="$(docker inspect --format '{{index .RepoDigests 0}}' "${image}:latest")"
          test "$latest" = "${{ steps.immutable.outputs.digest }}"

      - name: Export consumer handoff
        run: |
          printf '%s\n' '${{ steps.immutable.outputs.digest }}' > runner-image-digest.txt

      - name: Upload consumer handoff
        uses: actions/upload-artifact@v4.6.2
        with:
          name: senshac-runner-image-digest
          path: runner-image-digest.txt
          if-no-files-found: error
          retention-days: 90

      - name: Record publication
        run: |
          {
            echo "## CI runner publication"
            echo
            echo "- Immutable image (consumer pin): \`${{ steps.immutable.outputs.digest }}\`"
            echo "- Handoff artifact: \`senshac-runner-image-digest/runner-image-digest.txt\`"
            echo "- Previous latest (rollback): \`${{ steps.rollback.outputs.digest }}\`"
            echo "- Promoted tag: \`${REGISTRY}/${IMAGE_NAME}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
